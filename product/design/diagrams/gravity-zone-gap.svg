<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:svg="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     viewBox="0 0 900 320" width="900" height="320"
     role="img"
     aria-label="A Directional gravity zone reaches rigidbodies through the Jolt backend but is filtered out before it reaches the character controller.">
  <title>Where a Directional gravity zone stops</title>
  <desc>One component, two readers. The Jolt backend applies it to rigidbodies. ControllerSystem skips it unless the mode is Point, so the character controller never sees it.</desc>

  <defs>
    <marker id="arrowLive" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
    <marker id="arrowDead" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D62828"/>
    </marker>
  </defs>

  <g inkscape:groupmode="layer" inkscape:label="Source component" id="layer-source">
    <rect x="20" y="118" width="196" height="84" 
          fill="none" stroke="currentColor" stroke-width="3"/>
    <text x="118" y="148" text-anchor="middle" font-family="Archivo, Arial, sans-serif"
          font-size="13" font-weight="800" fill="currentColor">GravityZoneComponent</text>
    <text x="118" y="168" text-anchor="middle" font-family="monospace"
          font-size="12" fill="currentColor">mode = Directional</text>
    <text x="118" y="187" text-anchor="middle" font-family="Archivo, Arial, sans-serif"
          font-size="11" fill="currentColor" >the default value</text>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="Working path" id="layer-works">
    <line x1="216" y1="144" x2="392" y2="92" stroke="currentColor"
          stroke-width="3" marker-end="url(#arrowLive)"/>
    <text x="300" y="104" text-anchor="middle" font-family="Archivo, Arial, sans-serif"
          font-size="11" fill="currentColor">applied, mode not checked</text>

    <rect x="400" y="52" width="220" height="72" 
          fill="none" stroke="currentColor" stroke-width="3"/>
    <text x="510" y="80" text-anchor="middle" font-family="monospace"
          font-size="12" fill="currentColor">JoltBackend</text>
    <text x="510" y="100" text-anchor="middle" font-family="monospace"
          font-size="12" fill="currentColor">ApplyGravityZones()</text>

    <line x1="620" y1="88" x2="700" y2="88" stroke="currentColor"
          stroke-width="3" marker-end="url(#arrowLive)"/>

    <rect x="708" y="52" width="172" height="72" 
          fill="none" stroke="currentColor" stroke-width="3"/>
    <text x="794" y="80" text-anchor="middle" font-family="Archivo, Arial, sans-serif"
          font-size="13" font-weight="800" fill="currentColor">Rigidbody</text>
    <text x="794" y="100" text-anchor="middle" font-family="Archivo, Arial, sans-serif"
          font-size="12" fill="currentColor">floats, correctly</text>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="Broken path" id="layer-gap">
    <line x1="216" y1="176" x2="392" y2="228" stroke="#D62828"
          stroke-width="3" marker-end="url(#arrowDead)"/>
    <text x="300" y="222" text-anchor="middle" font-family="Archivo, Arial, sans-serif"
          font-size="11" fill="#D62828">read, then skipped</text>

    <rect x="400" y="196" width="220" height="86" 
          fill="none" stroke="#D62828" stroke-width="3"/>
    <text x="510" y="222" text-anchor="middle" font-family="monospace"
          font-size="12" fill="#D62828">ControllerSystem</text>
    <text x="510" y="243" text-anchor="middle" font-family="monospace"
          font-size="11" fill="#D62828">mode != Point</text>
    <text x="510" y="262" text-anchor="middle" font-family="monospace"
          font-size="11" fill="#D62828">&#8594; continue</text>

    <line x1="620" y1="239" x2="700" y2="239" stroke="#D62828"
          stroke-width="3" stroke-dasharray="5 5"/>
    <line x1="648" y1="225" x2="672" y2="253" stroke="#D62828" stroke-width="2"/>
    <line x1="672" y1="225" x2="648" y2="253" stroke="#D62828" stroke-width="2"/>

    <rect x="708" y="203" width="172" height="72" 
          fill="none" stroke="#D62828" stroke-width="3" stroke-dasharray="5 5"/>
    <text x="794" y="231" text-anchor="middle" font-family="Archivo, Arial, sans-serif"
          font-size="13" font-weight="800" fill="#D62828">CharacterController</text>
    <text x="794" y="251" text-anchor="middle" font-family="Archivo, Arial, sans-serif"
          font-size="12" fill="#D62828">normal gravity, no warning</text>
  </g>
</svg>

name: CI

# Desktop build + unit tests on Windows, engine build for WebAssembly.
# Runners have no GPU, so GPU-dependent test suites are excluded — but the
# render path still gets smoke coverage: after the build, the editor boots a
# tiny checked-in scene (Tests/GoldenScene) on lavapipe (Mesa's software
# Vulkan driver), renders 30 frames, and a checker asserts the capture is a
# real image (not flat/black). This engine's worst historical bugs (fossil
# shaders, dead render features) lived exactly where compile+CPU tests can't
# see; this closes that gap without needing GPU runners.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Don't cancel in-flight main builds on new pushes - the Windows job takes
# ~40 minutes and a busy push cadence would mean it NEVER completes. PRs still
# cancel stale runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-desktop:
    name: Windows (build + tests)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.3.283.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      # assimp, Jolt, Box2D, nlohmann and miniaudio are all pinned to tags, so
      # a run fetches and builds the identical bytes every time. The key covers
      # the CMake files that choose the versions; change one and the cache
      # rebuilds.
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-windows-${{ hashFiles('Engine/CMakeLists.txt', 'CMakeLists.txt', 'Core/CMakeLists.txt') }}
          restore-keys: deps-windows-

      - name: Configure
        run: cmake -B build -S . -DENJIN_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        working-directory: build
        # The four env-gated suites need an audio device / packed assets the
        # runner doesn't have; GPU suites need a real GPU.
        run: ctest -C Release --output-on-failure -E "TestAudio|TestAudioTypes|TestAssetPack|TestAssetLoaders"

      - name: Install software Vulkan (lavapipe)
        shell: pwsh
        # mesa-dist-win ships lavapipe, Mesa's CPU Vulkan implementation. Pinned
        # release; VK_DRIVER_FILES points the Vulkan loader at it in the next step.
        run: |
          curl.exe -sL -o mesa.7z https://github.com/pal1000/mesa-dist-win/releases/download/26.2.0/mesa3d-26.2.0-release-msvc.7z
          7z x mesa.7z -omesa -y | Out-Null
          if (-not (Test-Path "mesa\x64\lvp_icd.x86_64.json")) { throw "lavapipe ICD not found after extract" }
          # Runner jobs are ELEVATED, and the Vulkan loader ignores VK_DRIVER_FILES /
          # VK_ICD_FILENAMES in elevated processes (secure-environment rule) - the
          # diagnostics showed "Found no drivers" with registry-only scanning. Register
          # the ICD in HKLM instead, which the loader always honors.
          reg add "HKLM\SOFTWARE\Khronos\Vulkan\Drivers" /v "${{ github.workspace }}\mesa\x64\lvp_icd.x86_64.json" /t REG_DWORD /d 0 /f

      - name: Stage Vulkan loader for the smoke test
        shell: pwsh
        # The runner has no GPU drivers, so no system vulkan-1.dll exists and GLFW
        # cannot even query instance extensions. The SDK action's source-built
        # loader turned out not to satisfy GLFW's probe, so stage the OFFICIAL
        # LunarG runtime loader (the signed dll shipped games use) next to the
        # editor instead.
        run: |
          curl.exe -sL -o vkrt.zip https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-runtime-components.zip
          Expand-Archive vkrt.zip -DestinationPath vkrt -Force
          $dll = Get-ChildItem -Recurse vkrt -Filter vulkan-1.dll | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if (-not $dll) { throw "x64 vulkan-1.dll not found in the runtime zip" }
          Copy-Item $dll.FullName build\bin\Release\
          Write-Host "staged $($dll.FullName)"

      - name: Probe the staged Vulkan loader
        shell: pwsh
        env:
          VK_DRIVER_FILES: ${{ github.workspace }}\mesa\x64\lvp_icd.x86_64.json
        # Loads the staged dll directly and enumerates instance extensions - tells
        # apart "dll cannot load" from "loader reports nothing" without guesswork.
        run: |
          Get-ChildItem build\bin\Release\vulkan-1.dll | Format-List Name,Length
          python -c "import ctypes, ctypes.util, os; d = ctypes.WinDLL(os.path.abspath(r'build/bin/Release/vulkan-1.dll')); n = ctypes.c_uint32(0); r = d.vkEnumerateInstanceExtensionProperties(None, ctypes.byref(n), None); print('enumerate result', r, 'extension count', n.value)"

      - name: Render smoke test (golden capture on lavapipe)
        shell: pwsh
        timeout-minutes: 15
        # A required check since the first green run (2026-08-23). Historical
        # note: the long-hunted "mid-boot lavapipe crash" was never a crash -
        # EnjinEditor is a GUI-subsystem exe, PowerShell's call operator does
        # not wait for those, $LASTEXITCODE stayed unset, the step threw
        # instantly, and the runner killed the half-booted editor at step
        # teardown. Piping stdout (below) forces a real wait.
        env:
          VK_DRIVER_FILES: ${{ github.workspace }}\mesa\x64\lvp_icd.x86_64.json
          VK_ICD_FILENAMES: ${{ github.workspace }}\mesa\x64\lvp_icd.x86_64.json
          VK_LOADER_DEBUG: error,warn
        # Boot the editor on the checked-in probe scene, auto-play, render 30
        # play-mode frames (the golden counter waits for play mode, so scripts,
        # physics, and controllers are actually running), capture the game
        # view, exit. Three gates: the checker fails on a flat / black / white
        # capture (= the render path silently died), and the log must show the
        # GoldenSmoke canary script running (= the AngelScript runtime compiles
        # and executes scene scripts). Not a pixel diff on purpose: lavapipe's
        # rasterization differs from real GPUs, so structural checks are what's
        # stable.
        run: |
          New-Item -ItemType Directory -Force golden_out | Out-Null
          # The pipeline is load-bearing: without it PowerShell does not wait for
          # a GUI-subsystem exe and $LASTEXITCODE is never set. Piping stdout
          # blocks until the editor closes its end, and streams the log live.
          & build\bin\Release\EnjinEditor.exe "${{ github.workspace }}\Tests\GoldenScene\GoldenScene.enjinproject" --play --golden "${{ github.workspace }}\golden_out\smoke" --golden-frames 30 2>&1 | Tee-Object -Variable editorLog | ForEach-Object { "$_" }
          if ($LASTEXITCODE -ne 0) { throw "editor exited with code $LASTEXITCODE" }
          if (-not ($editorLog | Where-Object { "$_" -match "GoldenSmoke: script runtime is alive" })) {
            throw "script canary never ran - the AngelScript runtime is broken in play mode"
          }
          python Tests/GoldenScene/check_golden.py golden_out/smoke

      - name: Play-cycle stress (T4 - 15 play/stop cycles, memory bounded)
        shell: pwsh
        timeout-minutes: 15
        # MASTER_VALIDATION T4: the play->stop->restore lifecycle must not leak.
        # The probe destroys a skinned entity each cycle to force the full-reload
        # restore path, counts 15 cycles, and exits nonzero if RSS grew past the
        # post-warmup baseline + 50% + 128MB. Local baseline 2026-08-29: dead
        # flat at ~562 MB over 25 cycles.
        env:
          VK_DRIVER_FILES: ${{ github.workspace }}\mesa\x64\lvp_icd.x86_64.json
          VK_ICD_FILENAMES: ${{ github.workspace }}\mesa\x64\lvp_icd.x86_64.json
        run: |
          & build\bin\Release\EnjinEditor.exe "${{ github.workspace }}\Tests\GoldenScene\GoldenScene.enjinproject" --play --play-cycle 40 15 2>&1 | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          # The engine writes a SYMBOLISED crash report (Core/src/Debug/CrashHandler.cpp)
          # next to the EXECUTABLE, not next to where it was launched: Application
          # calls SetWorkingDirectoryToExecutableDirectory() before installing the
          # handler. CI looked in the workspace root and found nothing, so an access
          # violation here has only ever surfaced as "exit -1073741819" plus a
          # half-written log line. The report carries GPU, scene, exception, module
          # and a stack with file:line for engine frames.
          $report = "build/bin/Release/enjin_crash.txt"
          if (Test-Path $report) {
            Write-Host "=================== enjin_crash.txt ==================="
            Get-Content $report | ForEach-Object { "$_" }
            Write-Host "======================================================="
          } else {
            Write-Host "(no crash report at $report)"
          }
          if ($code -ne 0) { throw "play-cycle stress failed with code $code" }

      - name: Exported-game smoke (pack + run the Windows player headless)
        shell: pwsh
        timeout-minutes: 15
        # Covers the SHIPPED Windows player, not just the editor: pack GoldenScene
        # into a Game.exe + enjpak with the build pipeline, then boot that game
        # headless (--frames auto-starts gameplay past the title screen) and
        # assert it loads its scene, survives a real render loop, and runs its
        # scene scripts. Windows is the primary ship target, so its shipped
        # player needs runtime coverage too.
        env:
          VK_DRIVER_FILES: ${{ github.workspace }}\mesa\x64\lvp_icd.x86_64.json
        run: |
          & build\bin\Release\EnjinEditor.exe "${{ github.workspace }}\Tests\GoldenScene\GoldenScene.enjinproject" --build-web "${{ github.workspace }}\Tests\GoldenScene\GoldenScene.enjinproject" "${{ github.workspace }}\game_out" 2>&1 | ForEach-Object { "$_" }
          if (-not (Test-Path "${{ github.workspace }}\game_out\Game.exe")) { throw "no Game.exe was produced" }
          # The exported Game.exe sits in game_out\ with no system Vulkan loader
          # beside it (the runner has no GPU), so stage the same loader dll the
          # editor smoke uses. The lavapipe ICD is already registered in HKLM.
          Copy-Item build\bin\Release\vulkan-1.dll "${{ github.workspace }}\game_out\"
          & "${{ github.workspace }}\game_out\Game.exe" --frames 120 2>&1 | Tee-Object -Variable gameLog | ForEach-Object { "$_" }
          if ($LASTEXITCODE -ne 0) { throw "exported game exited with code $LASTEXITCODE" }
          if (-not ($gameLog | Where-Object { "$_" -match "Loaded scene" })) { throw "exported game never loaded its scene" }
          if (-not ($gameLog | Where-Object { "$_" -match "Headless frame limit reached" })) { throw "exported game did not survive its render loop (crash?)" }
          if (-not ($gameLog | Where-Object { "$_" -match "GoldenSmoke: script runtime is alive" })) { throw "exported game did not run scene scripts (script runtime broken in shipped player)" }

      - name: Upload golden capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-capture
          path: |
            golden_out/
            game_out/*.log
            build/bin/Release/enjin_crash.dmp
            build/bin/Release/enjin_crash.txt
          if-no-files-found: ignore

  linux-desktop:
    name: Linux (build + render smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        # Same package set the port was validated against (Ubuntu 24.04, GCC 13).
        # mesa-vulkan-drivers ships lavapipe; xvfb gives GLFW an X server on the
        # headless runner (GLFW needs a live X connection to report Vulkan
        # surface extensions). zenity is what FileDialog drives on Linux — without
        # it every dialog returns an empty string, which is indistinguishable from
        # the user cancelling, so the whole Open/Save/Browse path was unreachable
        # here and the breakage that shipped for it could not have been caught.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build pkg-config \
            libvulkan-dev libglfw3-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libcurl4-openssl-dev mesa-vulkan-drivers \
            vulkan-tools xvfb zenity

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build-linux/_deps
          key: deps-linux-${{ hashFiles('Engine/CMakeLists.txt', 'CMakeLists.txt', 'Core/CMakeLists.txt') }}
          restore-keys: deps-linux-

      - name: Runtime system-tick parity
        # Pure source check, no build needed, so it runs before the slow steps.
        # Three runtimes hand-maintain their own tick lists, and a system added
        # to one and forgotten in another is silent: no warning, no error, just
        # a feature that does nothing in the runtime nobody tested. That is how
        # FlowerSystem and AudioReactiveSystem ended up dead on web while the
        # shipped flower template depended on them.
        #
        # Baseline-pinned like tools/backend_parity.py: existing divergence is
        # recorded with a reason, and this fails only when the divergence GROWS.
        run: python3 tools/runtime_parity.py --strict

      - name: Configure
        run: cmake -B build-linux -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DENJIN_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build-linux --parallel

      - name: Run tests
        working-directory: build-linux
        run: ctest --output-on-failure -E "TestAudio|TestAudioTypes|TestAssetPack|TestAssetLoaders"

      - name: Render smoke test (golden capture on lavapipe)
        timeout-minutes: 15
        # Same three gates as the Windows smoke: editor exits 0, the GoldenSmoke
        # canary script ran (AngelScript native calling conventions differ per
        # ABI, so this catches SysV-specific binding breaks like the ALLFLOATS
        # return-type issue), and the capture is a real image.
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          set -o pipefail
          mkdir -p golden_out
          xvfb-run -a ./build-linux/bin/EnjinEditor "$GITHUB_WORKSPACE/Tests/GoldenScene/GoldenScene.enjinproject" \
            --play --golden "$GITHUB_WORKSPACE/golden_out/smoke" --golden-frames 30 2>&1 | tee editor.log
          grep -q "GoldenSmoke: script runtime is alive" editor.log || { echo "script canary never ran"; exit 1; }
          python3 Tests/GoldenScene/check_golden.py golden_out/smoke

      - name: Exported-game smoke (pack + run the Linux player headless)
        timeout-minutes: 10
        # Proves the whole shipping path, not just the editor: the build pipeline
        # packs the project into a Linux game (Game binary + game.enjpak +
        # scripts), and that game boots, loads its packed scene, runs a real
        # render loop, and exits 0 via --frames. This is what a shipped Linux /
        # Steam Deck game actually does.
        #
        # Runs 120 frames (not 30): the shutdown crash this guards against was a
        # dangling-renderer deref in the exported game's teardown, and
        # dangling-pointer UB only faults once the freed memory is reused, which
        # takes a longer run to surface. 120 frames reproduced it reliably on
        # lavapipe; the fix releases the scene render target while the renderer
        # is still alive (Player Shutdown).
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          set -o pipefail
          ./build-linux/bin/EnjinEditor "$GITHUB_WORKSPACE/Tests/GoldenScene/GoldenScene.enjinproject" \
            --build-web "$GITHUB_WORKSPACE/Tests/GoldenScene/GoldenScene.enjinproject" "$GITHUB_WORKSPACE/game_out" 2>&1 | tee pack.log
          test -x "$GITHUB_WORKSPACE/game_out/Game" || { echo "no Game binary was produced"; exit 1; }
          cd "$GITHUB_WORKSPACE/game_out"
          xvfb-run -a ./Game --frames 120 2>&1 | tee game.log
          grep -q "Loaded scene" game.log || { echo "exported game never loaded its scene"; exit 1; }
          grep -q "Headless frame limit reached" game.log || { echo "exported game did not survive its render loop (crash?)"; exit 1; }
          # --frames auto-starts gameplay (skips the title screen), so the smoke
          # exercises the actual game loop, not just the menu. Assert the canary
          # script's OnStart ran: proves the SHIPPED player's AngelScript runtime
          # compiles and executes scene scripts (the SysV ABI binding path).
          grep -q "GoldenSmoke: script runtime is alive" game.log || { echo "exported game did not run scene scripts (script runtime broken in shipped player)"; exit 1; }

      - name: Package Linux build
        # Turns the CI build into a downloadable Linux build (editor + player).
        # The binaries are self-contained apart from standard desktop system
        # libraries (Vulkan loader, GLFW, X11), so this tarball runs on any
        # Linux desktop or Steam Deck with those present. Not a formal release,
        # just an artifact on each run so a Linux build always exists to grab.
        run: |
          STAGE="$GITHUB_WORKSPACE/tege-linux-x86_64"
          mkdir -p "$STAGE/bin"
          cp build-linux/bin/EnjinEditor build-linux/bin/EnjinPlayer "$STAGE/bin/"
          strip "$STAGE/bin/EnjinEditor" "$STAGE/bin/EnjinPlayer" || true
          cat > "$STAGE/README.txt" <<'EOF'
          TEGE (Enjin) - Linux x86_64 build

          Contents:
            bin/EnjinEditor  - the editor
            bin/EnjinPlayer  - the standalone game player (build export copies this)

          These binaries embed their own shaders, fonts, and scripting API, so
          there is nothing else to unpack. They need a Vulkan-capable system and
          a few standard desktop libraries. On Debian/Ubuntu/SteamOS:

            sudo apt-get install libvulkan1 libglfw3 mesa-vulkan-drivers

          Run the editor:   ./bin/EnjinEditor
          Open a project:   ./bin/EnjinEditor /path/to/Game.enjinproject

          No GPU? Software rendering works via Mesa's lavapipe:
            VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json ./bin/EnjinEditor
          EOF
          tar -C "$GITHUB_WORKSPACE" -czf tege-linux-x86_64.tar.gz tege-linux-x86_64
          ls -lh tege-linux-x86_64.tar.gz

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: tege-linux-x86_64
          path: tege-linux-x86_64.tar.gz
          if-no-files-found: warn

      - name: Upload golden capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-capture-linux
          path: |
            golden_out/
            game_out/*.log
          if-no-files-found: ignore

  linux-sanitizers:
    # ASan and TSan over the unit-test suite. The CMake options for these have
    # existed since the Linux port and were never run by anything, so the two
    # bug classes they catch -- use-after-free on a freed object, and data races
    # -- were only ever found by reading code. The 2026-09-05 review turned up
    # both (a detached streaming worker outliving its manager; an unsynchronised
    # size() read next to a concurrent push), which is exactly what these would
    # have flagged the day they were written.
    #
    # Deliberately NOT running the render/editor smokes: a sanitised build under
    # lavapipe is slow enough to blow the timeout, and third-party GPU stacks
    # produce noise that would bury real findings. The unit suite is where the
    # threading and lifetime code actually lives.
    #
    # Was continue-on-error while the first run's findings were triaged. That run
    # (2026-09-06) found two real defects -- a missing sized operator delete in
    # the global allocator, and a heap-use-after-free in TestScriptTeardown --
    # both since fixed, plus one RSS gate that is meaningless under a sanitizer
    # and now opts out. So this blocks properly now, which is the only way a
    # sanitizer job stays useful.
    name: Linux (sanitizers)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # ASan and TSan are mutually exclusive (the CMake config hard-errors if
        # both are set), so they get one build each.
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build pkg-config \
            libvulkan-dev libglfw3-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libcurl4-openssl-dev

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build-san-${{ matrix.sanitizer }}/_deps
          key: deps-san-${{ matrix.sanitizer }}-${{ hashFiles('Engine/CMakeLists.txt', 'CMakeLists.txt', 'Core/CMakeLists.txt') }}
          restore-keys: deps-san-${{ matrix.sanitizer }}-

      - name: Configure
        # RelWithDebInfo, not Release: sanitizer reports are unreadable without
        # frame pointers and line numbers, and the CMake block already adds
        # -fno-omit-frame-pointer alongside the sanitizer flags.
        # Editor and player are skipped -- only the test binaries are run here.
        run: |
          ASAN=OFF; TSAN=OFF
          if [ "${{ matrix.sanitizer }}" = "address" ]; then ASAN=ON; fi
          if [ "${{ matrix.sanitizer }}" = "thread" ]; then TSAN=ON; fi
          cmake -B build-san-${{ matrix.sanitizer }} -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DENJIN_BUILD_TESTS=ON \
            -DENJIN_BUILD_EDITOR=OFF \
            -DENJIN_BUILD_PLAYER=OFF \
            -DENJIN_ENABLE_ASAN=$ASAN \
            -DENJIN_ENABLE_TSAN=$TSAN

      - name: Build
        run: cmake --build build-san-${{ matrix.sanitizer }} --parallel

      - name: Run tests under ${{ matrix.sanitizer }} sanitizer
        working-directory: build-san-${{ matrix.sanitizer }}
        # Same four env-gated suites the other jobs skip (audio device / asset
        # fixtures not present on a runner).
        #
        # detect_leaks=0 on the first pass: leak reports from the vendored
        # libraries would bury the use-after-free findings this is here for.
        # Turn it on once the tree is clean under ASan proper.
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:strict_string_checks=1
          TSAN_OPTIONS: halt_on_error=0:second_deadlock_stack=1
        run: ctest --output-on-failure -E "TestAudio|TestAudioTypes|TestAssetPack|TestAssetLoaders"

  web:
    name: Web (WebAssembly build)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The WGSL in WebShaderData.h is compiled by the BROWSER at run time, so a
      # green Emscripten build says nothing about it: a syntax error, a type
      # error or a uniformity violation reaches a player as a black canvas, not
      # as a build failure. This step runs Dawn — the same compiler Chrome uses —
      # over the same source. Dawn's node bindings ship prebuilt and fall back to
      # a software device, which is why the two graphics packages are enough.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install shader-check dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers

      - name: Cache shader-check node modules
        uses: actions/cache@v4
        with:
          path: tools/node_modules
          key: wgslcheck-${{ hashFiles('tools/package.json') }}

      - name: Validate web shaders (WGSL)
        working-directory: tools
        run: |
          npm install --no-audit --no-fund
          node check_wgsl.mjs
          node check_instancing.mjs

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.5   # matches the local D:/emsdk toolchain
          actions-cache-folder: emsdk-cache

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build-web-ci/_deps
          key: deps-web-${{ hashFiles('Engine/CMakeLists.txt', 'CMakeLists.txt', 'Core/CMakeLists.txt') }}
          restore-keys: deps-web-

      - name: Configure
        run: emcmake cmake -B build-web-ci -S . -DENJIN_PLATFORM_WEB=ON

      - name: Build
        # Was capped at 2: unbounded parallelism OOM-killed clang on the 4-core
        # runner (exit 137), because the engine's big translation units each ate
        # gigabytes. The largest single cause of that was 3.2 MB of hex literal
        # in ShaderData.h being lexed by all 28 files that included it; those
        # bytes now live in one source file the web build excludes. 4 is the
        # runner's core count. If exit 137 comes back, put it to 3, not 2, and
        # find out which translation unit grew.
        run: cmake --build build-web-ci --parallel 4

name: Bug Report
description: Report a bug or crash in TEGE
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill out the fields below so we can reproduce the issue.

  - type: input
    id: version
    attributes:
      label: Engine Version
      placeholder: "e.g. 0.9.5"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Describe what you were doing and what went wrong.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened instead?

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the editor
        2. Create a new scene
        3. ...

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Crash / Data Loss
        - Major (feature broken)
        - Minor (workaround exists)
        - Cosmetic
    validations:
      required: true

  - type: textarea
    id: system
    attributes:
      label: System info
      placeholder: "OS, GPU, driver version (Help > Report Bug includes this automatically)"

  - type: textarea
    id: logs
    attributes:
      label: Crash report / logs
      description: Paste enjin_crash.txt or relevant log lines if available.
      render: text

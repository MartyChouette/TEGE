name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for TEGE? We'd love to hear it.

  - type: textarea
    id: description
    attributes:
      label: What would you like?
      placeholder: Describe the feature or improvement you'd like to see.
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      placeholder: What problem does this solve? How would you use it?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Editor
        - Rendering
        - Physics
        - Animation
        - Audio
        - Scripting
        - ECS / Components
        - Build / Export
        - Accessibility
        - Documentation
        - Other

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: Have you found a workaround or alternative approach?

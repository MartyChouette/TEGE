<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Enjin player</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden;
               font:13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  #stage { position:fixed; inset:0; }
  canvas { width:100%; height:100%; display:block; outline:none; touch-action:none; }
  #veil { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
          justify-content:center; gap:14px; background:#0b0d12; color:#c9d1d9; }
  #veil.gone { display:none; }
  #bar { width:min(260px, 60vw); height:3px; background:#21262d; border-radius:2px; overflow:hidden; }
  #fill { height:100%; width:0%; background:#58a6ff; transition:width .18s ease; }
  #msg { font-size:12px; color:#8b949e; font-variant-numeric:tabular-nums; }
  #err { display:none; max-width:min(420px,80vw); text-align:center; color:#f0883e; font-size:12px; line-height:1.5; }
  .mark { font-weight:600; letter-spacing:.22em; font-size:12px; color:#8b949e; }
</style>
</head>
<body>
<div id="stage"><canvas id="game" tabindex="0" oncontextmenu="return false"></canvas></div>
<div id="veil">
  <div class="mark">TEGE</div>
  <div id="bar"><div id="fill"></div></div>
  <div id="msg">starting</div>
  <div id="err"></div>
</div>

<script src="enjin-boot.js"></script>
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  // Game directory, relative to this page. Restricted to a relative path so an
  // embed cannot be pointed at an arbitrary origin by editing the URL.
  var game = qs.get('game') || '../../demoroom/playground/';
  if (/^[a-z]+:|^\/\//i.test(game)) game = '../../demoroom/playground/';

  var fill = document.getElementById('fill');
  var msg  = document.getElementById('msg');
  var veil = document.getElementById('veil');
  var err  = document.getElementById('err');

  function fail(text) {
    msg.style.display = 'none';
    document.getElementById('bar').style.display = 'none';
    err.style.display = 'block';
    err.textContent = text;
  }

  // Tell the host page what is happening, so a feed can show its own progress
  // and know when the game is live.
  function post(type, data) {
    try { parent.postMessage(Object.assign({ enjin: type }, data || {}), '*'); } catch (e) {}
  }

  if (!navigator.gpu) {
    fail('This game needs WebGPU. On iPhone or iPad update to iOS 26 and open it in Safari; on a computer use a recent Chrome or Edge, or Safari 26.');
    post('error', { reason: 'no-webgpu' });
    return;
  }

  EnjinBoot.boot({
    baseUrl: game,
    canvas: document.getElementById('game'),
    version: qs.get('v') || '',
    onProgress: function (frac, label) {
      fill.style.width = Math.round(frac * 100) + '%';
      msg.textContent = label;
      post('progress', { frac: frac, label: label });
    },
    onReady: function () {
      veil.classList.add('gone');
      post('ready');
      document.getElementById('game').focus();
    },
    onPrint: function (t, isErr) { (isErr ? console.error : console.log)(t); }
  }).catch(function (e) {
    fail('Could not start the game: ' + e.message);
    post('error', { reason: e.message });
  });

  // The host asks for fullscreen on our behalf; iOS Safari blocks the
  // Fullscreen API for non-video elements, and the host handles that case by
  // expanding the iframe with CSS instead.
  addEventListener('message', function (ev) {
    if (!ev.data || ev.data.enjinCmd !== 'fullscreen') return;
    var el = document.documentElement;
    var fn = el.requestFullscreen || el.webkitRequestFullscreen;
    if (fn) { try { fn.call(el); } catch (e) {} }
  });
})();
</script>
</body>
</html>

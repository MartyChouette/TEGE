<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>TEGE - Web Demo</title>
<style>
* { margin:0; padding:0; }
body { background:#111; display:flex; justify-content:center; align-items:center; height:100vh; }
canvas { max-width:100vw; max-height:100vh; }
#loading { position:absolute; color:#fff; font-family:sans-serif; font-size:18px; }
</style>
</head><body>
<div id="loading">Loading TEGE...</div>
<canvas id="game-canvas" width="1280" height="720"></canvas>
<script>
var Module = {
  canvas: document.getElementById('game-canvas'),
  onRuntimeInitialized: function() {
    document.getElementById('loading').style.display = 'none';
    console.log('TEGE Web Player initialized');
  },
  setStatus: function(text) {
    if (text) document.getElementById('loading').textContent = text;
  }
};
</script>
<script src="EnjinPlayer.js"></script>
</body></html>

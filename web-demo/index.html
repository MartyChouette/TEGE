<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TEGE - Web Demo</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#111; display:flex; justify-content:center; align-items:center; height:100vh; flex-direction:column; overflow:hidden; }
#game-container { width:100%; height:100vh; position:relative; }
#game-canvas { width:100%; height:100%; display:block; outline:none; }
#loading { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#fff; font-family:sans-serif; font-size:18px; z-index:10; }
#error { color:#f44; font-family:sans-serif; font-size:16px; padding:20px; text-align:center; display:none; }
#error a { color:#8af; }
#perf-hud {
  position:fixed; top:8px; left:8px; color:#0f0; font:12px monospace;
  background:rgba(0,0,0,0.7); padding:6px 10px; z-index:999;
  pointer-events:none; display:none;
}
</style>
</head><body>
<div id="game-container">
  <div id="loading">Loading TEGE...</div>
  <div id="error"></div>
  <canvas id="game-canvas" tabindex="0"></canvas>
</div>
<div id="perf-hud"></div>
<script>
// Check WebGPU support before loading WASM. Checking navigator.gpu alone is not
// enough: some browsers (e.g. Firefox on blocklisted drivers) expose the API but
// return a null adapter, which would otherwise boot the engine into a dead canvas.
function showNoWebGPU(detail) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('game-canvas').style.display = 'none';
  var err = document.getElementById('error');
  err.style.display = 'block';
  err.innerHTML = '<h2>WebGPU Not Available</h2><p>' + detail + '</p>' +
    '<p>Try <a href="https://www.google.com/chrome/">Chrome</a> or <a href="https://www.microsoft.com/edge">Edge</a> (v113+).</p>' +
    '<p>If you are on one of those and still see this, check that hardware acceleration is enabled.</p>';
}
if (!navigator.gpu) {
  showNoWebGPU('Your browser does not support WebGPU.');
} else {
  var canvas = document.getElementById('game-canvas');

  // Responsive canvas via ResizeObserver — drives pixel dimensions from CSS layout
  var _runtimeReady = false;
  var resizeObserver = new ResizeObserver(function(entries) {
    var r = entries[0].contentRect;
    var dpr = window.devicePixelRatio || 1;
    var w = Math.floor(r.width);
    var h = Math.floor(r.height);
    if (w <= 0 || h <= 0) return;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    if (_runtimeReady) {
      Module._onCanvasResize(w, h, dpr);
    }
  });
  resizeObserver.observe(document.getElementById('game-container'));

  // Debug overlay: add ?debug to the URL to see engine errors on screen
  var _dbg = null;
  if (location.search.includes('debug')) {
    _dbg = document.createElement('pre');
    _dbg.style.cssText = 'position:fixed;bottom:0;left:0;right:0;max-height:45vh;overflow:auto;margin:0;' +
      'background:rgba(0,0,0,0.85);color:#f88;font:11px monospace;padding:8px;z-index:1000;white-space:pre-wrap;';
    document.body.appendChild(_dbg);
  }
  function _dbgLog(prefix, msg) {
    if (_dbg) _dbg.textContent += prefix + msg + '\n';
  }
  window.addEventListener('error', function(e) { _dbgLog('[js] ', e.message + ' @ ' + e.filename + ':' + e.lineno); });
  window.addEventListener('unhandledrejection', function(e) { _dbgLog('[promise] ', String(e.reason)); });

  var Module = {
    canvas: canvas,
    onRuntimeInitialized: function() {
      _runtimeReady = true;
      document.getElementById('loading').style.display = 'none';
    },
    setStatus: function(text) {
      if (text) document.getElementById('loading').textContent = text;
    },
    print: function(text) { console.log(text); _dbgLog('[out] ', text); },
    printErr: function(text) { console.error(text); _dbgLog('[err] ', text); }
  };

  // Opt-in performance HUD: add ?perf to URL
  if (location.search.includes('perf')) {
    var hud = document.getElementById('perf-hud');
    hud.style.display = 'block';
    setInterval(function() {
      // Emscripten export stubs abort if called before runtime init
      if (_runtimeReady && Module._getDrawCallCount) {
        hud.textContent = 'DC: ' + Module._getDrawCallCount() +
                          ' | Ent: ' + Module._getEntityCount();
      }
    }, 250);
  }

  // Only load the engine once the browser has actually granted an adapter
  navigator.gpu.requestAdapter().then(function(adapter) {
    if (!adapter) {
      showNoWebGPU('Your browser supports WebGPU but did not provide a graphics adapter. This usually means the graphics driver is blocklisted.');
      return;
    }
    var s = document.createElement('script');
    s.src = 'EnjinPlayer.js';
    document.body.appendChild(s);
  }).catch(function(e) {
    showNoWebGPU('WebGPU adapter request failed: ' + e);
  });
}
</script>
</body></html>
